[package]
name = "ferrite-embedded"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
ferrite = {path = "../Ferrite", default-features = false, features = ["defmt"]}
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
stm32f4xx-hal = { version = "0.21", features = ["stm32f446"] }


[profile.release]
opt-level = 3
lto = true
debug = 2

